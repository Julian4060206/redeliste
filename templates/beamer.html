<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'media' }</script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 font-sans antialiased transition-colors duration-300 h-screen overflow-hidden flex flex-col">

    <h1 class="text-2xl font-bold border-b-2 border-blue-600 dark:border-blue-400 pb-2 mb-4 shrink-0">Aktuelle Redeliste</h1>
    
    <ul id="beamerList" class="space-y-3 overflow-y-auto flex-grow pr-2">
        </ul>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const listElement = document.getElementById("beamerList");
            listElement.innerHTML = "";

            if (data.list.length === 0) {
                listElement.innerHTML = "<li class='text-gray-500 dark:text-gray-400 italic text-center py-4'>Aktuell keine Wortmeldungen</li>";
                return;
            }

            data.list.forEach(person => {
                const li = document.createElement("li");
                
                // Basis-Klassen für jedes Listenelement
                let baseClasses = "p-3 rounded-lg shadow border flex justify-between items-center text-lg transition-all duration-300 ";

                // Styling je nach Status (Aktiv, GO, Normal)
                if (person.active) {
                    baseClasses += "bg-blue-600 border-blue-700 text-white font-bold transform scale-[1.02]";
                } else if (person.is_go) {
                    baseClasses += "bg-amber-50 dark:bg-amber-900/20 border-amber-300 dark:border-amber-700";
                } else {
                    baseClasses += "bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700";
                }

                li.className = baseClasses;

                let innerHTML = `<span>${person.name}</span>`;

                // Badges hinzufügen
                let badges = `<div class="flex gap-2">`;
                if (person.is_go) {
                    badges += `<span class="${person.active ? 'bg-amber-400 text-amber-900' : 'bg-amber-500 text-white'} text-xs font-bold px-2 py-1 rounded shadow-sm">GO</span>`;
                }
                if (person.active) {
                    badges += `<span class="text-xs bg-white text-blue-600 font-bold px-2 py-1 rounded shadow-sm animate-pulse">Spricht</span>`;
                }
                badges += `</div>`;

                li.innerHTML = innerHTML + badges;
                listElement.appendChild(li);
            });
        };

        ws.onclose = function(e) {
            setTimeout(function() { window.location.reload(); }, 2000);
        };
    </script>
</body>
</html>
